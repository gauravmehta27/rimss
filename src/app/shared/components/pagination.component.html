@if (totalPages() > 1) {
  <nav aria-label="Product pages">
    <ul class="pagination pagination-sm mb-0 flex-wrap">
      <li class="page-item" [class.disabled]="page() === 1">
        <button type="button" class="page-link" (click)="go(page() - 1)" aria-label="Previous page">
          <i class="bi bi-chevron-left"></i>
        </button>
      </li>
      @for (item of window(); track $index) {
        @if (item === 'gap') {
          <li class="page-item disabled"><span class="page-link">…</span></li>
        } @else {
          <li class="page-item" [class.active]="item === page()">
            <button
              type="button"
              class="page-link"
              (click)="go(item)"
              [attr.aria-current]="item === page() ? 'page' : null"
            >
              {{ item }}
            </button>
          </li>
        }
      }
      <li class="page-item" [class.disabled]="page() === totalPages()">
        <button type="button" class="page-link" (click)="go(page() + 1)" aria-label="Next page">
          <i class="bi bi-chevron-right"></i>
        </button>
      </li>
    </ul>
  </nav>
}
